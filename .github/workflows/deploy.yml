name: CI/CD Build & Deploy Kundali Microservices to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: bibektimilsina00
  SERVER_HOST: 161.118.246.132
  SERVER_USER: ubuntu

jobs:
  build-and-push:
    name: Build & Push Microservices Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build FastAPI Backend Image
      - name: Build & Push FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kundali-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Next.js Web Frontend Image
      - name: Build & Push Next.js Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kundali-web:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/kundali:latest
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_HOST=${{ secrets.NEXT_PUBLIC_UMAMI_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Microservices Stack via SSH
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository for Compose Config
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/kundali/"

      - name: Deploy Microservices on Remote Server (ubuntu@161.118.246.132)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "========================================="
            echo "🚀 Launching Kundali Microservices Stack"
            echo "========================================="

            # 1. Login to GHCR on the remote server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Prepare deployment directory
            mkdir -p ~/kundali
            cd ~/kundali

            # 3. Dynamically generate .env file from GitHub Secrets
            echo "Generating production .env configuration..."
            cat << 'EOF' > .env
            PORT=3000
            NODE_ENV=production
            PYTHON_PATH=python3
            POSTGRES_DB=kundali
            POSTGRES_USER=kundali
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD || 'kundalipassword' }}"
            FASTAPI_URL=http://kundali_api:8000
            AGENT_ROUTER_API_KEY="${{ secrets.AGENT_ROUTER_API_KEY }}"
            AGENT_ROUTER_BASE_URL="${{ secrets.AGENT_ROUTER_BASE_URL }}"
            AGENT_ROUTER_MODEL="${{ secrets.AGENT_ROUTER_MODEL }}"
            OPEN_ROUTER_API_KEY="${{ secrets.OPEN_ROUTER_API_KEY }}"
            OPEN_ROUTER_BASE_URL="${{ secrets.OPEN_ROUTER_BASE_URL }}"
            OPEN_ROUTER_MODEL="${{ secrets.OPEN_ROUTER_MODEL }}"
            OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            LLM_BASE_URL="${{ secrets.LLM_BASE_URL }}"
            LLM_API_KEY="${{ secrets.LLM_API_KEY }}"
            LLM_MODEL="${{ secrets.LLM_MODEL }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}"
            NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}"
            NEXT_PUBLIC_UMAMI_WEBSITE_ID="${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}"
            NEXT_PUBLIC_UMAMI_HOST="${{ secrets.NEXT_PUBLIC_UMAMI_HOST }}"
            EOF

            # 4. Pull microservice container images
            echo "Pulling latest microservice images..."
            docker compose pull || docker-compose pull

            # 5. Stop single container if previously running standalone
            docker stop kundali-app || true
            docker rm kundali-app || true

            # 6. Launch 3 microservices (kundali_postgres, kundali_api, kundali_web)
            echo "Starting docker compose stack..."
            docker compose up -d || docker-compose up -d

            # 7. Clean up unused images to preserve VPS disk space
            docker image prune -f

            echo "========================================="
            echo "✅ Kundali Microservices Stack Deployed Successfully!"
            echo "🌐 Web App Live at: http://${{ env.SERVER_HOST }}:3000"
            echo "🌐 Web App (Alt Port): http://${{ env.SERVER_HOST }}:29000"
            echo "🔌 FastAPI Backend: http://${{ env.SERVER_HOST }}:28001/health"
            echo "========================================="
