include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/api/generated/**        # OpenAPI output; never hand-edited
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
    - sort_child_properties_last
