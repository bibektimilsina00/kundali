version: '3.8'

services:
  kundali-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GHCR_IMAGE:-ghcr.io/bibektimilsina/kundali:latest}
    container_name: kundali-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PYTHON_PATH=python3
